name: Build Android APK (Flutter & Native Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Build Standalone Flutter Android APK with SQLite & Native Call Log
  build-flutter-apk:
    name: Build Flutter Release APK (SQLite & Call Log)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload Flutter Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forensic-call-finder-flutter-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

  # Job 2: Build Native Android Telephony APK (Capacitor & AndroidNativeBridge)
  build-native-apk:
    name: Build Native Android APK (Edge-to-Edge Bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --no-save --no-package-lock --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Configure Android project
        run: |
          npx cap add android || true
          node scripts/android-configure.cjs
          npx cap sync android
          node scripts/android-configure.cjs

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forensic-call-finder-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
