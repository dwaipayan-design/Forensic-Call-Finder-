<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Forensic Midnight Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2042"/>
      <stop offset="50%" stop-color="#0066EB"/>
      <stop offset="100%" stop-color="#0051C6"/>
    </linearGradient>

    <!-- Subtle Inner Border Highlight Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#001B44" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (Centered symmetrically on the 512x512 canvas) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" style="stroke-width: 1;"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="url(#glowGrad)" stroke-width="3" style="stroke-width: 3;"/>

  <!-- Background Radar / Signal Grid concentric arcs -->
  <g opacity="0.2" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="160" stroke-dasharray="6 8"/>
    <circle cx="256" cy="256" r="120"/>
    <circle cx="256" cy="256" r="80" stroke-dasharray="4 6"/>
  </g>

